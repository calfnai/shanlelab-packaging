<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 100 1500 420" role="img" aria-labelledby="title desc"><title id="title">四个共用小号与一个中号同幅比例对照</title><desc id="desc">A6笔记本、卡套、磁吸卡套和护照夹使用同样大小的小号外袋，粉色POP使用中号。候选外袋宽度比例8比11，底边对齐。</desc><rect width="1500" height="520" fill="white"/><svg x="18.000" y="203.541" width="254.141" height="181.529" viewBox="0 0 742 530"><image href="../v05/small-shared-four.png" width="1484" height="1060"/></svg><text x="145.755" y="408" text-anchor="middle" font-size="16" fill="#34382f">A6 笔记本</text><text x="145.755" y="431" text-anchor="middle" font-size="12" fill="#777">S · 同一个小号</text><path d="M 33.755 453 v -7 m 0 7 h 224 m 0 0 v -7" fill="none" stroke="#df702d" stroke-width="1.5"/><svg x="288.000" y="203.541" width="254.141" height="181.529" viewBox="742 0 742 530"><image href="../v05/small-shared-four.png" width="1484" height="1060"/></svg><text x="415.755" y="408" text-anchor="middle" font-size="16" fill="#34382f">卡套</text><text x="415.755" y="431" text-anchor="middle" font-size="12" fill="#777">S · 同一个小号</text><path d="M 303.755 453 v -7 m 0 7 h 224 m 0 0 v -7" fill="none" stroke="#df702d" stroke-width="1.5"/><svg x="558.000" y="203.541" width="254.141" height="181.529" viewBox="0 530 742 530"><image href="../v05/small-shared-four.png" width="1484" height="1060"/></svg><text x="685.755" y="408" text-anchor="middle" font-size="16" fill="#34382f">磁吸卡套</text><text x="685.755" y="431" text-anchor="middle" font-size="12" fill="#777">S · 同一个小号</text><path d="M 573.755 453 v -7 m 0 7 h 224 m 0 0 v -7" fill="none" stroke="#df702d" stroke-width="1.5"/><svg x="828.000" y="203.541" width="254.141" height="181.529" viewBox="742 530 742 530"><image href="../v05/small-shared-four.png" width="1484" height="1060"/></svg><text x="955.755" y="408" text-anchor="middle" font-size="16" fill="#34382f">护照夹 · 横放</text><text x="955.755" y="431" text-anchor="middle" font-size="12" fill="#777">S · 同一个小号</text><path d="M 843.755 453 v -7 m 0 7 h 224 m 0 0 v -7" fill="none" stroke="#df702d" stroke-width="1.5"/><svg x="1095" y="132.236" width="386.041" height="249.730" viewBox="0 0 1484 960"><image href="../v04/medium.png" width="1484" height="1060"/></svg><text x="1288.020" y="408" text-anchor="middle" font-size="16" fill="#34382f">粉色 POP 包</text><text x="1288.020" y="431" text-anchor="middle" font-size="12" fill="#777">M · 中号</text><path d="M 1134.020 453 v -7 m 0 7 h 308 m 0 0 v -7" fill="none" stroke="#df702d" stroke-width="1.5"/><path d="M 20 373 H 1480" stroke="#999" stroke-dasharray="3 7" stroke-opacity=".45"/><text x="750" y="494" text-anchor="middle" font-size="13" fill="#777">统一显示比例 · 小号 : 中号 = 8 : 11（候选关系，非生产定尺）</text></svg>